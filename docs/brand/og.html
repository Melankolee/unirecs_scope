<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@import url("https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap");
* { box-sizing: border-box; margin: 0; }
body {
  width: 1200px; height: 630px; overflow: hidden;
  background: #14141a;
  color: #fff;
  font: 400 17px/1.6 "Satoshi", -apple-system, sans-serif;
  position: relative;
}
.glow {
  position: absolute; width: 900px; height: 900px; border-radius: 50%;
  background: radial-gradient(circle, rgba(177,92,255,0.22), rgba(20,20,26,0) 62%);
  right: -260px; top: -300px;
}
.glow2 {
  position: absolute; width: 700px; height: 700px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,92,168,0.14), rgba(20,20,26,0) 62%);
  left: -240px; bottom: -320px;
}
.pad { position: relative; padding: 76px 80px; height: 100%; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 18px; font-weight: 700; font-size: 30px; letter-spacing: -0.01em; }
.tile {
  width: 54px; height: 54px; border-radius: 14px;
  background: linear-gradient(140deg, #7b61ff, #b15cff 55%, #ff5ca8);
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 30px;
}
h1 { margin-top: 62px; font-weight: 900; font-size: 78px; line-height: 1.04; letter-spacing: -0.035em; max-width: 900px; }
.grad {
  background: linear-gradient(120deg, #7b61ff, #b15cff 50%, #ff5ca8);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
p.lead { margin-top: 30px; font-size: 29px; line-height: 1.45; color: #9a9aab; max-width: 880px; }
.foot { margin-top: auto; display: flex; align-items: center; gap: 20px; }
.badge {
  display: inline-flex; align-items: center; gap: 12px;
  border-radius: 10px; padding: 12px 20px;
  background: rgba(255,92,168,0.14); color: #ff5ca8;
  font-weight: 700; font-size: 22px;
}
.badge::before { content: ""; width: 11px; height: 11px; border-radius: 10px; background: currentColor; }
.note { font: 400 21px/1 "Satoshi", sans-serif; color: #6a6a7d; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="glow2"></div>
<div class="pad">
  <div class="brand"><span class="tile">M</span><span>Mailtrick</span></div>
  <h1>“Could you just<br><span class="grad">quickly also…</span>”</h1>
  <p class="lead">Paste what you agreed to, paste the client’s message — get a verdict and a reply you can send.</p>
  <div class="foot">
    <span class="badge">Out of scope</span>
    <span class="note">Free · no account · about a minute</span>
  </div>
</div>
</body>
</html>
