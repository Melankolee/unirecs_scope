# /etc/nginx/sites-available/scopeguard
# TLS via certbot: certbot --nginx -d scopeguard.example.com

server {
    listen 80;
    server_name scopeguard.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name scopeguard.example.com;

    ssl_certificate     /etc/letsencrypt/live/scopeguard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scopeguard.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # A check can take the full 30s model timeout; don't cut it off at nginx.
    proxy_read_timeout 60s;

    client_max_body_size 512k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
