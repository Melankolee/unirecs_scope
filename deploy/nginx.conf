# /etc/nginx/sites-available/scopeguard
#
# The certificate has to exist before this file loads, or nginx refuses to
# start and takes every other site on the box down with it. Issue it against a
# throwaway `listen 80` block first:
#
#   certbot certonly --nginx -d scopeguard.anytoolai.store
#
# then install this one and reload.

server {
    listen 80;
    listen [::]:80;
    server_name scopeguard.anytoolai.store;
    return 301 https://$host$request_uri;
}

server {
    # `http2 on;` is nginx 1.25+; this box runs 1.24, where the protocol still
    # rides on `listen`. It is set on IPv4 only: another site already binds
    # [::]:443 with its own options, and repeating them there earns a warning
    # for a socket whose options are decided by whoever binds it first.
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name scopeguard.anytoolai.store;

    ssl_certificate     /etc/letsencrypt/live/scopeguard.anytoolai.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scopeguard.anytoolai.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # A check can take the full 30s model timeout; don't cut it off at nginx.
    proxy_read_timeout 60s;

    client_max_body_size 512k;

    # Everything here arrives from the Node process upstream, and nginx leaves
    # proxied responses uncompressed unless told otherwise — hence
    # `gzip_proxied`, without which this whole block is a no-op. text/html is
    # compressed unconditionally and must not be listed; naming it is a
    # duplicate-type warning at reload.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript application/json
               image/svg+xml application/xml text/plain;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
